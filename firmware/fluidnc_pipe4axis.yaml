# =====================================================================
#  FluidNC - cấu hình máy cắt ống 4 trục chạy trên ESP32
#  Nạp bằng WebUI (Files -> Upload) rồi đặt làm cấu hình đang dùng,
#  hoặc gõ trong terminal:  $Config/Filename=fluidnc_pipe4axis.yaml
#
#  Vai trò trục (khớp với config/machine_default.json của PipeCut Studio):
#    Y = ỐNG RA VÀO - bàn mang mâm cặp chạy dọc theo trục ống   (mm)
#    A = MÂM CẶP XOAY ống                                       (ĐỘ)
#    X = MỎ CẮT CHẠY NGANG, vuông góc với trục Y                (mm)
#    Z = MỎ CẮT LÊN XUỐNG                                       (mm)
#
#  Lưu ý: trục dọc theo ống ở máy này là **Y** chứ không phải X, vì chính
#  phôi ống tịnh tiến chứ không phải xe mang mỏ cắt.  PipeCut Studio xuất
#  G-code theo đúng vai trò đã khai báo nên không cần đổi gì thêm.
#
#  FIRMWARE CẦN NẠP: FluidNC bản **WiFi** (install-wifi), không phải bản bt.
#  ESP32 chỉ có một sóng vô tuyến nên WiFi và Bluetooth không chạy cùng lúc,
#  FluidNC vì thế tách làm hai bản firmware riêng.  Muốn dùng chức năng nối
#  qua mạng LAN của PipeCut Studio thì bắt buộc là bản WiFi.
#
#  !! CHÂN GPIO bên dưới dành cho **ESP32 DevKit (WROOM-32) + 4 driver rời**.
#     Đã chọn tránh mọi chân có vấn đề khi khởi động (xem bảng dưới).
#     Bo mạch của bạn khác thì phải đối chiếu lại trước khi nạp !!
#
#  Những chân ESP32 KHÔNG được dùng và vì sao:
#    gpio 6,7,8,11   nối trực tiếp vào chip nhớ flash - FluidNC báo "Unusable"
#    gpio 34..39     CHỈ VÀO, và **không có điện trở treo bên trong**.  Dùng làm
#                    công tắc hành trình được, nhưng phải hàn điện trở treo
#                    10k lên 3V3 bên ngoài, và KHÔNG được ghi ':pu'.
#    gpio 12         kéo cao lúc khởi động là ESP32 chọn sai điện áp flash rồi
#                    treo máy - tuyệt đối không dùng cho STEP/DIR.
#    gpio 0, 2, 5    chân quyết định chế độ khởi động; gpio 2 còn nối đèn LED
#                    trên bo.  Không dùng cho rơ-le nguồn cắt.
#    gpio 14, 15     phát xung PWM ngay lúc khởi động.
#    gpio 1, 3       là TX/RX của cổng USB.
#    gpio 16, 17     một số bo WROVER dùng cho PSRAM - nên tránh cho chắc.
# =====================================================================

name: "May cat ong 4 truc"
board: "ESP32 DevKit (WROOM-32) + 4 driver roi"

stepping:
  engine: RMT          # RMT cho xung sạch nhất trên ESP32
  idle_ms: 250         # giữ dòng 250 ms sau khi dừng rồi mới nhả
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

# Bộ đệm và tốc độ nạp lệnh -------------------------------------------
# PipeCut Studio nạp lệnh theo kiểu đếm ký tự, luôn giữ bộ đệm gần đầy
# nên planner của FluidNC lúc nào cũng có nhiều block để nhìn trước.
planner_blocks: 32

axes:
  shared_stepper_disable_pin: NO_PIN

  # --- X: mỏ cắt chạy ngang (vuông góc với trục ống) --------------------
  x:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 3000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 200.000
    soft_limits: true
    homing:
      cycle: 3
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1500.000
      settle_ms: 250
      pulloff_mm: 3.000
    motor0:
      # Chân chỉ-vào, không treo được bên trong -> hàn điện trở 10k lên 3V3.
      limit_neg_pin: gpio.34:low
      hard_limits: false
      pulloff_mm: 3.000
      stepstick:
        step_pin: gpio.32
        direction_pin: gpio.33
        disable_pin: gpio.23

  # --- Y: ống ra vào (bàn mang mâm cặp chạy dọc trục ống) ---------------
  # Đây là trục chịu tải nặng nhất: nó kéo cả phôi ống.  Đặt gia tốc vừa
  # phải để ống không bị trượt trong mâm cặp khi đảo chiều.
  y:
    steps_per_mm: 80.000          # vitme 5 mm/vòng, 1/16 vi bước - hãy tự tính lại
    max_rate_mm_per_min: 4000.000
    acceleration_mm_per_sec2: 250.000
    max_travel_mm: 1200.000
    soft_limits: true
    homing:
      cycle: 2
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1000.000
      settle_ms: 250
    motor0:
      limit_neg_pin: gpio.35:low        # chân chỉ-vào -> điện trở 10k lên 3V3
      hard_limits: false
      pulloff_mm: 2.000
      stepstick:
        step_pin: gpio.25
        direction_pin: gpio.26
        disable_pin: gpio.23

  # --- Z: nâng hạ mỏ cắt ----------------------------------------------
  z:
    steps_per_mm: 400.000
    max_rate_mm_per_min: 2000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 150.000
    soft_limits: true
    homing:
      cycle: 1                    # Z về gốc trước để mỏ cắt không vướng phôi
      positive_direction: true
      mpos_mm: 150.000
      feed_mm_per_min: 300.000
      seek_mm_per_min: 1000.000
      settle_ms: 250
    motor0:
      limit_pos_pin: gpio.36:low        # chân chỉ-vào -> điện trở 10k lên 3V3
      hard_limits: false
      pulloff_mm: 2.000
      stepstick:
        step_pin: gpio.27
        direction_pin: gpio.13
        disable_pin: gpio.23

  # --- A: mâm cặp xoay ống (ĐƠN VỊ = ĐỘ) --------------------------------
  #
  #  steps_per_mm của trục A chính là "số xung cho mỗi ĐỘ quay":
  #
  #      steps_per_deg = (bước_động_cơ * vi_bước * tỉ_số_truyền) / 360
  #
  #  Ví dụ: động cơ 1.8 độ (200 xung/vòng), vi bước 1/8, hộp giảm tốc 6:1
  #      = (200 * 8 * 6) / 360 = 26.667 xung/độ
  #
  #  Không đặt max_travel/soft_limits cho trục xoay: nó quay vô hạn, và
  #  PipeCut Studio quay dồn góc liên tục để đường cắt không bị đứt đoạn.
  a:
    steps_per_mm: 26.667
    max_rate_mm_per_min: 3600.000   # 3600 độ/phút = 10 vòng/phút
    acceleration_mm_per_sec2: 400.000
    max_travel_mm: 0.000
    soft_limits: false
    homing:
      cycle: 0                      # 0 = không về gốc (mâm cặp không cần)
    motor0:
      hard_limits: false
      stepstick:
        step_pin: gpio.18
        direction_pin: gpio.19
        disable_pin: gpio.23

# --- Nguồn cắt --------------------------------------------------------
# Plasma / oxy-gas: dùng rơ-le, M3 bật - M5 tắt.
#
# !! AN TOÀN: KHÔNG đặt rơ-le mỏ cắt vào gpio 0, 2, 5, 14, 15.  Đó là những
#    chân quyết định chế độ khởi động hoặc phát xung PWM ngay khi cấp điện -
#    mỏ cắt có thể phụt một nhát lúc bật nguồn.  gpio 21 dưới đây là chân
#    thường, không dính gì tới khởi động.
#
#    Dù chọn chân nào cũng nên dùng rơ-le **thường hở** (normally open) và
#    lắp thêm một công tắc cắt tay nối tiếp trên đường mồi của nguồn cắt.
spindle:
  relay:
    output_pin: gpio.21
    enable_pin: NO_PIN
    disable_with_s0: true
    s0_with_disable: true
    spinup_ms: 0
    spindown_ms: 0
    tool_num: 0
    speed_map: 0=0% 1=100%

# Nếu dùng LASER thì thay khối trên bằng:
# spindle:
#   PWM:
#     pwm_hz: 5000
#     output_pin: gpio.21
#     enable_pin: NO_PIN
#     disable_with_s0: false
#     s0_with_disable: true
#     tool_num: 0
#     speed_map: 0=0.000% 1000=100.000%
# và bật chế độ laser:  $GCode/LaserMode=true

# --- Cổng vào ra khác --------------------------------------------------
control:
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  reset_pin: NO_PIN
  safety_door_pin: NO_PIN

probe:
  pin: gpio.22:low:pu       # dò chạm bề mặt ống để đặt gốc Z
  check_mode_start: true

start:
  must_home: false          # đặt true nếu máy có đủ công tắc hành trình

# =====================================================================
#  BẢNG CHÂN TỔNG HỢP - nối dây theo bảng này
# =====================================================================
#   Trục / thiết bị        STEP      DIR       Hành trình
#   ---------------------  --------  --------  ----------------------
#   X  mỏ cắt ngang        gpio 32   gpio 33   gpio 34  (+10k lên 3V3)
#   Y  ống ra vào          gpio 25   gpio 26   gpio 35  (+10k lên 3V3)
#   Z  mỏ lên xuống        gpio 27   gpio 13   gpio 36  (+10k lên 3V3)
#   A  mâm cặp xoay        gpio 18   gpio 19   (không có)
#
#   ENABLE chung cả 4 driver : gpio 23
#   Dò chạm (probe)          : gpio 22  (treo trong được, dùng :pu)
#   Rơ-le nguồn cắt          : gpio 21
#
#  Ba chân hành trình 34/35/36 là loại CHỈ VÀO nên không treo được bên
#  trong: bắt buộc hàn điện trở 10k từ chân đó lên 3V3, nếu không công tắc
#  sẽ báo lung tung.  Đây cũng là lý do trong tệp này chúng không ghi ':pu'
#  - ghi vào thì FluidNC in ra lỗi "does not support :pu attribute".
#
# --- Ghi chú cấu hình có trục vát -------------------------------------
# Nếu dùng trục X làm TRỤC VÁT (nghiêng mỏ cắt) thay cho bàn chạy ngang:
#   1. Đổi steps_per_mm của X sang "xung mỗi độ" (công thức như trục A)
#   2. Đặt max_travel_mm theo góc nghiêng cơ khí cho phép, ví dụ 50 độ
#   3. Bên PipeCut Studio dùng tệp config/machine_bevel.json
