[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecut-studio"
version = "1.4.2"
description = "Phần mềm điều khiển máy cắt ống 4 trục ESP32/FluidNC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.scripts]
pipecut = "pipecut.cli:main"

[tool.setuptools.packages.find]
include = ["pipecut*"]
