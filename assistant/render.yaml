services:
  - type: web
    name: tro-ly-ai
    runtime: python
    plan: free
    rootDir: assistant
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # dien tay trong dashboard, khong commit vao git
      - key: APP_PASSWORD
        sync: false
      - key: MODEL
        value: claude-opus-5
      - key: EFFORT
        value: high
      - key: WORKSPACE
        value: /tmp/workspace
